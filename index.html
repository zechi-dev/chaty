<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaty App</title>
<meta name="theme-color" content="#00a884">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');*{font-family:Inter,sans-serif}</style>
</head>
<body class="bg-[#111b21] h-screen flex flex-col overflow-hidden">

<div id="authScreen" class="fixed inset-0 bg-[#111b21] z-[100] flex items-center justify-center p-6">
<div class="w-full max-w-sm text-center">
<div class="w-20 h-20 bg-[#00a884] rounded-full flex items-center justify-center mx-auto text-3xl font-bold text-white">C</div><h1 class="text-white text-3xl font-bold mt-4">Chaty App</h1><p class="text-[#8696a0] text-sm mt-1">Simple. Secure. Yours.</p>
<div id="loginBox" class="space-y-3 mt-8 text-left"><input id="loginEmail" type="email" placeholder="Email" class="w-full bg-[#202c33] text-white p-3.5 rounded-lg outline-none"><input id="loginPass" type="password" placeholder="Password" class="w-full bg-[#202c33] text-white p-3.5 rounded-lg outline-none"><button id="loginBtn" class="w-full bg-[#00a884] text-white p-3.5 rounded-lg font-semibold">Login</button><p class="text-center text-[#8696a0] text-sm">No account? <span id="toRegister" class="text-[#53bdeb] cursor-pointer font-bold">Register</span></p></div>
<div id="registerBox" class="space-y-3 hidden mt-8 text-left"><input id="regName" type="text" placeholder="Full Name" class="w-full bg-[#202c33] text-white p-3.5 rounded-lg"><input id="regEmail" type="email" placeholder="Email" class="w-full bg-[#202c33] text-white p-3.5 rounded-lg"><input id="regPass" type="password" placeholder="Password" class="w-full bg-[#202c33] text-white p-3.5 rounded-lg"><button id="registerBtn" class="w-full bg-[#00a884] text-white p-3.5 rounded-lg font-semibold">Register</button><p class="text-center text-[#8696a0] text-sm">Have account? <span id="toLogin" class="text-[#53bdeb] cursor-pointer font-bold">Login</span></p></div>
<div id="verifyBox" class="space-y-3 hidden mt-8"><p class="text-white">Your code: <span id="verifyEmailText" class="font-bold text-[#00a884] text-2xl"></span></p><input id="verifyCodeInput" type="text" placeholder="6-digit code" class="w-full bg-[#202c33] text-white p-3.5 rounded-lg text-center text-2xl tracking-widest"><button id="verifyBtn" class="w-full bg-[#00a884] text-white p-3.5 rounded-lg font-semibold">Verify</button></div>
<p id="authError" class="text-red-400 text-sm text-center mt-3 hidden"></p>
</div>
</div>

<div id="appScreen" class="hidden h-screen flex-col">
<div class="bg-[#202c33] text-white p-3 flex items-center justify-between">
<div class="flex items-center gap-3"><img id="myAvatar" src="" class="w-10 h-10 rounded-full bg-[#00a884]"><div><h1 class="font-semibold text-[19px]">Chaty</h1><p id="myNameDisplay" class="text-xs text-[#8696a0]"></p></div></div>
<div class="flex items-center gap-5 text-[#aebac1] text-xl"><i id="btnInvite" class="fa-solid fa-user-plus cursor-pointer text-[#00a884]"></i><i id="btnLogout" class="fa-solid fa-right-from-bracket cursor-pointer"></i></div>
</div>

<div class="bg-[#111b21] p-2.5"><div class="bg-[#202c33] rounded-full flex items-center px-4 py-2 gap-3"><i class="fa-solid fa-magnifying-glass text-[#8696a0] text-sm"></i><input id="searchInput" type="text" placeholder="Search or start new chat" class="bg-transparent text-white text-[14px] w-full outline-none"></div></div>

<div class="bg-[#202c33] flex text-[#8696a0] text-[13px] font-medium"><button data-tab="chats" class="tabBtn flex-1 py-3.5 border-b-[3px] border-[#00a884] text-white">CHATS <span id="userCount" class="bg-[#00a884] text-white text-[11px] px-1.5 py-0.5 rounded-full ml-1">0</span></button><button data-tab="status" class="tabBtn flex-1 py-3.5">STATUS</button><button data-tab="calls" class="tabBtn flex-1 py-3.5">CALLS</button></div>

<div class="flex-1 flex overflow-hidden relative">
<div id="chatsTab" class="w-full md:w-[400px] bg-[#111b21] flex flex-col">
<div id="usersList" class="flex-1 overflow-y-auto"></div>
<button id="fabNewChat" class="absolute bottom-6 right-6 md:left-[340px] md:right-auto w-14 h-14 bg-[#00a884] rounded-full flex items-center justify-center text-white text-xl shadow-lg"><i class="fa-solid fa-comment"></i></button>
</div>

<div id="chatWindow" class="hidden md:flex flex-1 bg-[#efeae2] flex-col relative">
