<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaty</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0f0f13;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#1e1e26;padding:24px;border-radius:20px;width:90%;max-width:380px;border:1px solid #2d2d3a}
input{width:100%;padding:14px;margin:8px 0;background:#12121a;border:1px solid #2d2d3a;color:#fff;border-radius:12px}
button{width:100%;padding:14px;background:#6c5ce7;color:#fff;border:0;border-radius:12px;font-weight:700;margin-top:8px;cursor:pointer}
.tab{display:flex;gap:8px;background:#12121a;padding:5px;border-radius:10px;margin-bottom:16px}
.tab div{flex:1;text-align:center;padding:8px;border-radius:8px;cursor:pointer}
.active{background:#6c5ce7!important}
.hidden{display:none}
#chat{position:fixed;inset:0;background:#0f0f13;display:flex;flex-direction:column}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.m{padding:10px 14px;border-radius:16px;max-width:80%;font-size:14px}
.me{align-self:flex-end;background:#6c5ce7}
.other{align-self:flex-start;background:#1e1e26;border:1px solid #2d2d3a}
</style>
</head>
<body>

<div id="auth" class="card">
<h1 style="text-align:center;margin-bottom:16px">chaty<span style="color:#a29bfe">.app</span></h1>
<div class="tab"><div id="tL" class="active" onclick="showL()">Login</div><div id="tR" onclick="showR()">Register</div></div>
<div id="boxL"><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="leErr" style="color:#ff7675;font-size:12px;margin-top:8px"></p></div>
<div id="boxR" class="hidden"><input id="rn" placeholder="Name"><input id="re" placeholder="Email"><input id="rp" type="password" placeholder="Password (6+ chars)"><button onclick="reg()">Create Account</button><p id="reErr" style="color:#ff7675;font-size:12px;margin-top:8px"></p></div>
</div>

<div id="chat" class="hidden">
<div style="padding:14px;background:#1e1e26;display:flex;justify-content:space-between"><b>chaty.app</b><button onclick="logout()" style="width:auto;padding:6px 12px;background:#2d2d3a">Logout</button></div>
<div id="msgs"></div>
<div style="padding:12px;display:flex;gap:8px;background:#1e1e26"><input id="mi" placeholder="Message..." style="margin:0;flex:1"><button onclick="send()" style="width:50px;margin:0">></button></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,addDoc,query,orderBy,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,updateProfile} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA29zVf5kMGWWbf03njNONAl8uzCD2GnYk",
  authDomain: "chaty-a4725.firebaseapp.com",
  projectId: "chaty-a4725",
  storageBucket: "chaty-a4725.firebasestorage.app",
  messagingSenderId: "1005836465051",
  appId: "1:1005836465051:web:228af3826e8419ab6fa73e",
  measurementId: "G-RZ71SXL80R"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);
let unsub=null;

window.showL=()=>{boxL.classList.remove('hidden');boxR.classList.add('hidden');tL.classList.add('active');tR.classList.remove('active')}
window.showR=()=>{boxR.classList.remove('hidden');boxL.classList.add('hidden');tR.classList.add('active');tL.classList.remove('active')}

window.reg=async()=>{
 const n=rn.value.trim(),e=re.value.trim(),p=rp.value;
 if(!n||!e||p.length<6){reErr.textContent='Fill all, password 6+ chars';return}
 reErr.textContent='Creating...';
 try{const c=await createUserWithEmailAndPassword(auth,e,p);await updateProfile(c.user,{displayName:n});}
 catch(err){reErr.textContent=err.message}
}

window.login=async()=>{
 try{await signInWithEmailAndPassword(auth,le.value.trim(),lp.value)}
 catch(err){leErr.textContent=err.message}
}

window.logout=async()=>{if(unsub)unsub();await signOut(auth)}
window.send=async()=>{
 const t=mi.value.trim();if(!t)return;mi.value='';
 await addDoc(collection(db,'messages'),{text:t,uid:auth.currentUser.uid,name:auth.currentUser.displayName||auth.currentUser.email,createdAt:serverTimestamp()})
}

onAuthStateChanged(auth,user=>{
 if(user){
  auth.classList.add('hidden');chat.classList.remove('hidden');
  const q=query(collection(db,'messages'),orderBy('createdAt','asc'));
  unsub=onSnapshot(q,snap=>{
   msgs.innerHTML='';snap.forEach(d=>{const m=d.data();const div=document.createElement('div');div.className='m '+(m.uid===user.uid?'me':'other');div.textContent=m.name+': '+m.text;msgs.appendChild(div)});
   msgs.scrollTop=msgs.scrollHeight;
  })
 }else{auth.classList.remove('hidden');chat.classList.add('hidden')}
})
</script>
</body>
</html>
