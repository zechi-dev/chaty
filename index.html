<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaty App - WhatsApp Clone</title>
<meta name="theme-color" content="#00a884">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');*{font-family:Inter,sans-serif}</style>
</head>
<body class="bg-[#111b21] h-screen flex flex-col overflow-hidden">

<div id="authScreen" class="fixed inset-0 bg-[#111b21] z-[100] flex items-center justify-center p-6">
<div class="w-full max-w-sm">
<div class="text-center mb-8"><div class="w-20 h-20 bg-[#00a884] rounded-full flex items-center justify-center mx-auto text-3xl font-bold text-white">C</div><h1 class="text-white text-3xl font-bold mt-4">Chaty App</h1><p class="text-[#8696a0] text-sm">WhatsApp Clone</p></div>
<div id="loginBox" class="space-y-3"><input id="loginEmail" type="email" placeholder="Email" class="w-full bg-[#202c33] text-white p-3.5 rounded-lg outline-none"><input id="loginPass" type="password" placeholder="Password" class="w-full bg-[#202c33] text-white p-3.5 rounded-lg outline-none"><button id="loginBtn" class="w-full bg-[#00a884] text-white p-3.5 rounded-lg font-semibold">Login</button><p class="text-center text-[#8696a0] text-sm">No account? <span id="toRegister" class="text-[#53bdeb] cursor-pointer">Register</span></p></div>
<div id="registerBox" class="space-y-3 hidden"><input id="regName" type="text" placeholder="Full Name" class="w-full bg-[#202c33] text-white p-3.5 rounded-lg"><input id="regEmail" type="email" placeholder="Email" class="w-full bg-[#202c33] text-white p-3.5 rounded-lg"><input id="regPass" type="password" placeholder="Password" class="w-full bg-[#202c33] text-white p-3.5 rounded-lg"><button id="registerBtn" class="w-full bg-[#00a884] text-white p-3.5 rounded-lg font-semibold">Register & Send Code</button><p class="text-center text-[#8696a0] text-sm">Have account? <span id="toLogin" class="text-[#53bdeb] cursor-pointer">Login</span></p></div>
<div id="verifyBox" class="space-y-3 hidden"><p class="text-white text-center">Code sent to <span id="verifyEmailText" class="font-bold"></span></p><input id="verifyCodeInput" type="text" placeholder="6-digit code" maxlength="6" class="w-full bg-[#202c33] text-white p-3.5 rounded-lg text-center text-2xl tracking-widest"><button id="verifyBtn" class="w-full bg-[#00a884] text-white p-3.5 rounded-lg font-semibold">Verify</button></div>
<p id="authError" class="text-red-400 text-sm text-center mt-3 hidden"></p>
</div>
</div>

<div id="appScreen" class="hidden h-screen flex-col">
<div class="bg-[#202c33] text-white p-3 flex items-center justify-between"><div class="flex items-center gap-3"><img id="myAvatar" src="" class="w-10 h-10 rounded-full"><div><h1 class="font-semibold">Chaty</h1><p id="myNameDisplay" class="text-xs text-[#8696a0]"></p></div></div><div class="flex gap-4 text-xl text-[#aebac1]"><i id="btnLogout" class="fa-solid fa-right-from-bracket cursor-pointer"></i></div></div>
<div class="bg-[#202c33] flex text-[#8696a0] text-sm"><button data-tab="chats" class="tabBtn flex-1 py-3 border-b-2 border-[#00a884] text-white">CHATS</button><button data-tab="status" class="tabBtn flex-1 py-3">STATUS</button><button data-tab="calls" class="tabBtn flex-1 py-3">CALLS</button></div>
<div class="flex-1 flex overflow-hidden">
<div id="chatsTab" class="w-full md:w-96 bg-[#111b21] border-r border-[#222d34] flex flex-col"><div id="usersList" class="flex-1 overflow-y-auto"></div></div>
<div id="chatWindow" class="hidden md:flex flex-1 bg-[#0b141a] flex-col"><div class="bg-[#202c33] p-3 flex items-center justify-between"><div class="flex items-center gap-3"><i id="backToList" class="fa-solid fa-arrow-left md:hidden text-white cursor-pointer"></i><img id="chatAvatar" src="" class="w-10 h-10 rounded-full"><div><p id="chatName" class="text-white font-semibold"></p><p class="text-xs text-[#8696a0]">Tap phone/video to call</p></div></div><div class="flex gap-5 text-[#aebac1] text-xl"><i id="voiceCallBtn" class="fa-solid fa-phone cursor-pointer"></i><i id="videoCallBtn" class="fa-solid fa-video cursor-pointer"></i></div></div><div id="messages" class="flex-1 overflow-y-auto p-4 space-y-1"></div><div class="bg-[#202c33] p-2 flex items-center gap-2"><input id="msgInput" type="text" placeholder="Type a message" class="flex-1 bg-[#2a3942] text-white rounded-full px-4 py-2.5 outline-none"><button id="voiceNoteBtn" class="w-10 h-10 bg-[#2a3942] rounded-full text-[#8696a0]"><i class="fa-solid fa-microphone"></i></button><button id="sendBtn" class="bg-[#00a884] w-10 h-10 rounded-full text-white"><i class="fa-solid fa-paper-plane"></i></button></div></div>
<div id="statusTab" class="hidden w-full p-4 bg-[#0b141a] overflow-y-auto"><div class="bg-[#202c33] p-3 rounded-lg flex gap-3 items-center mb-4"><img id="statusMyAvatar" src="" class="w-12 h-12 rounded-full"><div class="flex-1"><p class="text-white">My Status</p><p class="text-xs text-[#8696a0]">Add status</p></div><label class="bg-[#00a884] w-8 h-8 rounded-full flex items-center justify-center text-white cursor-pointer"><i class="fa-solid fa-plus"></i><input id="statusFile" type="file" accept="image/*" class="hidden"></label
