<title>Chaty - Real App</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
body{background:#0f0f13;color:#fff;min-height:100vh;display:flex;flex-direction:column}
.header{padding:16px;background:#1e1e26;border-bottom:1px solid #2d2d3a;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:22px}.logo span{color:#a29bfe}
.btn{background:#6c5ce7;color:#fff;border:0;padding:14px;border-radius:12px;width:100%;font-weight:700;cursor:pointer;font-size:15px}
.input{width:100%;background:#12121a;border:1px solid #2d2d3a;color:#fff;padding:14px;border-radius:12px;margin:8px 0;font-size:15px}
.card{background:#1e1e26;border:1px solid #2d2d3a;border-radius:20px;padding:24px;margin:16px;max-width:420px;width:100%}
.center{display:flex;justify-content:center;align-items:center;flex:1;flex-direction:column;padding:20px}
.tabs{display:flex;gap:8px;background:#12121a;padding:6px;border-radius:12px;margin-bottom:20px}
.tab{flex:1;padding:10px;text-align:center;border-radius:8px;cursor:pointer;font-weight:600}
.tab.active{background:#6c5ce7}
.hidden{display:none!important}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.4}
.msg.me{align-self:flex-end;background:#6c5ce7;border-bottom-right-radius:4px}
.msg.other{align-self:flex-start;background:#1e1e26;border:1px solid #2d2d3a;border-bottom-left-radius:4px}
.composer{padding:12px;background:#1e1e26;border-top:1px solid #2d2d3a;display:flex;gap:10px;align-items:center}
.composer input{flex:1;margin:0}
</style>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
